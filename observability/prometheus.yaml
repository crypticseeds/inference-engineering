global:
  scrape_interval: 5s
  evaluation_interval: 30s

# Template only. render-prometheus.sh fills in the hosts printed by
# `modal serve` and writes the result outside the repo, so live hostnames are
# never committed. Both apps are unauthenticated, so no credentials are needed.
# Every scrape counts as traffic and keeps the GPU awake: run
# `docker compose down` when the session ends.
scrape_configs:
  - job_name: vllm # deploy/modal/vllm_qwen3_8b.py
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["VLLM_HOST:443"]

  - job_name: sglang # deploy/modal/sglang_qwen3_8b.py
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["SGLANG_HOST:443"]
