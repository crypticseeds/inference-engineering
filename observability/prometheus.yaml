global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  # vLLM on Modal (deploy/modal/vllm_qwen3_8b.py). The app is unauthenticated,
  # so no credentials are needed. Every scrape counts as traffic and keeps the
  # A10 awake: run `docker compose down` when the session ends.
  - job_name: vllm
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "MODAL_HOST:443" # replace with the host printed by `modal serve`
