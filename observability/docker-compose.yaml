# Prometheus + Grafana for Modal inference endpoints.
# Based on vllm-project/vllm examples/observability/prometheus_grafana @ 79e205e.
# Run from this directory: docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - "${PROMETHEUS_CONFIG:-./prometheus.yaml}:/etc/prometheus/prometheus.yml:ro"
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana.json:/var/lib/grafana/dashboards/vllm.json:ro
      - ./engines-grafana.json:/var/lib/grafana/dashboards/engines.json:ro

volumes:
  prometheus-data:
